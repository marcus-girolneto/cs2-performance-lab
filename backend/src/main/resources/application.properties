spring.application.name=cs2-performance-lab
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework
spring.mvc.problemdetails.enabled=true
app.faceit-key=${FACEIT_API_KEY:}
app.steam-api-key=${STEAM_API_KEY:}
app.leetify-api-key=${LEETIFY_API_KEY:}
app.csrep-api-key=${CSREP_API_KEY:}
app.community-directory=${COMMUNITY_DIRECTORY:./.community-data}
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
app.import-directory=${IMPORT_DIRECTORY:../.local-data}
